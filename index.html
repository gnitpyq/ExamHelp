<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rebrand.ly/examhelp - Coming Soon</title>

    <style> body { opacity: 0; transition: opacity 0.3s ease-in; } </style>

    <script>
        // ==========================================
        // SECURE TIME SYNC & SCHEDULE CONFIGURATION
        // ==========================================
        const redirectUrl = "https://drive.google.com/drive/folders/1BQ4TH_TGvBRMiKNYA8v5ZlEkZOQobP1Q?usp=drive_link";
        
        // Target dates locked to GMT+0530 (Indian Standard Time) 
        // to prevent timezone manipulation via VPNs
        const schedule = [
            { 
                open: new Date("June 4, 2026 11:30:00 GMT+0530").getTime(), 
                close: new Date("June 4, 2026 14:00:00 GMT+0530").getTime()
            },
            { 
                open: new Date("June 4, 2026 15:30:00 GMT+0530").getTime(), 
                close: new Date("June 4, 2026 18:00:00 GMT+0530").getTime()
            },
            { 
                open: new Date("June 5, 2026 11:30:00 GMT+0530").getTime(), 
                close: new Date("June 5, 2026 14:00:00 GMT+0530").getTime()
            },
            { 
                open: new Date("June 5, 2026 15:30:00 GMT+0530").getTime(), 
                close: new Date("June 5, 2026 18:00:00 GMT+0530").getTime()
            }
        ];

        const finalReopenDate = new Date("November 16, 2026 00:00:00 GMT+0530").getTime();

        let timeOffset = 0;
        let isTimeSynced = false;

        // Fetch true time from the internet to defeat local OS clock changes
        async function syncTrueTime() {
            try {
                // Swapped to TimeAPI.io which is less likely to be blocked by firewalls
                const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=Asia/Kolkata');
                const data = await response.json();
                
                // Note: TimeAPI uses 'dateTime' (capital T) instead of 'datetime'
                const trueInternetTime = new Date(data.dateTime).getTime();
                const fakeLocalTime = Date.now();
                
                // Calculate the exact difference between their computer clock and reality
                timeOffset = trueInternetTime - fakeLocalTime;
            } catch (error) {
                console.error("[SYS] Connection to time server blocked. Using local fallback.");
                // If they block this API request too, it falls back to local time
            } finally {
                isTimeSynced = true;
                executeSecurityCheck();
            }
        }

        // Always returns the mathematically corrected time
        function getRealTime() {
            return Date.now() + timeOffset;
        }

        function checkStatus() {
            const now = getRealTime();
            if (now >= finalReopenDate) return "OPEN";
            for (let i = 0; i < schedule.length; i++) {
                if (now >= schedule[i].open && now < schedule[i].close) return "OPEN";
            }
            return "LOCKED";
        }

        function executeSecurityCheck() {
            if (checkStatus() === "OPEN") {
                window.location.replace(redirectUrl);
            } else {
                // If vault is locked, reveal the UI
                document.body.style.opacity = "1";
                // Start the live countdown loop only after time is verified
                updateCountdown();
                setInterval(updateCountdown, 1000);
            }
        }

        // Start the sync process immediately
        syncTrueTime();
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&display=swap');

        :root {
            --bg-color: #0d1117; 
            --term-green: #39d353; 
            --term-dark-green: #2ea043;
            --term-red: #ff7b72;
            --text-main: #e6edf3;
            --scanline: rgba(57, 211, 83, 0.04);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            font-family: 'Fira Code', monospace;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 1rem;
        }

        /* CRT Scanline Effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                var(--scanline) 50%,
                var(--scanline)
            );
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* Background Log Stream */
        #bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.45;
            pointer-events: none;
            overflow: hidden;
            padding: 10px;
        }

        .bg-log {
            color: var(--term-dark-green);
            font-size: 0.85rem;
            margin-bottom: 4px;
            opacity: 1;
            transition: opacity 2s ease-out;
            text-shadow: 0 0 5px rgba(46, 160, 67, 0.4);
            position: absolute;
        }

        /* Terminal Window */
        .terminal {
            z-index: 10;
            width: 100%;
            max-width: 850px;
            max-height: calc(100vh - 2rem);
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363d;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(46, 160, 67, 0.1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(8px);
            border-radius: 8px;
            overflow: hidden;
        }

        /* Terminal Header */
        .terminal-header {
            background: #21262d;
            border-bottom: 1px solid #30363d;
            color: var(--text-main);
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            font-weight: 400;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
            margin-right: 15px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .btn:nth-child(1) { background: #ff5f56; }
        .btn:nth-child(2) { background: #ffbd2e; }
        .btn:nth-child(3) { background: #27c93f; }

        /* Terminal Body Content */
        .terminal-body {
            padding: clamp(1.2rem, 3vh, 2.5rem); 
            position: relative;
            flex: 1; 
            overflow-y: auto; 
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }
        
        .terminal-body::-webkit-scrollbar {
            display: none; 
        }

        /* Glitch Title */
        h1 {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            color: var(--term-green);
            text-shadow: 0 0 10px rgba(57, 211, 83, 0.5);
            letter-spacing: 1px;
            margin-bottom: clamp(0.5rem, 1vh, 0.8rem);
        }

        .status {
            display: inline-block;
            color: var(--term-red);
            background: rgba(255, 123, 114, 0.1);
            border: 1px solid var(--term-red);
            padding: 0.3rem 0.8rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            margin-bottom: clamp(1rem, 3vh, 2rem);
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 123, 114, 0.2);
            animation: blink-red 2s infinite;
        }

        @keyframes blink-red {
            0%, 100% { opacity: 1; border-color: var(--term-red); }
            50% { opacity: 0.5; border-color: rgba(255, 123, 114, 0.3); }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: clamp(1rem, 3vh, 2rem);
            border-top: 1px dashed #30363d;
            border-bottom: 1px dashed #30363d;
            padding: clamp(1rem, 2vh, 1.5rem) 0;
        }

        .stat-card {
            text-align: left;
            padding-left: 1rem;
            border-left: 3px solid var(--term-dark-green);
        }

        .stat-number {
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            font-weight: 600;
            color: var(--term-green);
            text-shadow: 0 0 8px rgba(57, 211, 83, 0.4);
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.2rem;
        }

        /* Typing Area */
        .message-box {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            line-height: 1.5;
            margin-bottom: clamp(1.2rem, 3vh, 2.5rem);
            min-height: 70px;
            color: var(--text-main);
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1rem;
            background-color: var(--term-green);
            vertical-align: middle;
            animation: blink-cursor 1s step-end infinite;
            margin-left: 4px;
        }

        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Countdown */
        .countdown-wrapper {
            background: rgba(57, 211, 83, 0.05);
            border: 1px solid var(--term-dark-green);
            border-radius: 6px;
            padding: clamp(1rem, 2vh, 1.5rem);
            position: relative;
        }

        .countdown-wrapper::before {
            content: "[ VAULT REOPENS IN  ]";
            position: absolute;
            top: -10px;
            left: 15px;
            background: rgba(22, 27, 34, 1);
            padding: 0 10px;
            font-size: 0.8rem;
            color: var(--term-green);
            font-weight: 600;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .time-box {
            text-align: center;
        }

        .time-box span {
            display: block;
            font-size: clamp(1.8rem, 4vw, 2.2rem);
            font-weight: 600;
            color: var(--term-green);
            text-shadow: 0 0 10px rgba(57, 211, 83, 0.4);
        }

        .time-box small {
            color: #8b949e;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* System Footer */
        .sys-log {
            margin-top: clamp(1rem, 3vh, 2.5rem);
            font-size: clamp(0.7rem, 1vw, 0.85rem);
            color: #8b949e;
            line-height: 1.5;
        }

        .sys-log span {
            color: var(--term-green);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .time-box span { font-size: 1.6rem; }
        }
    </style>
</head>

<body>

    <div id="bg-container"></div>

    <div class="terminal">
        <div class="terminal-header">
            <div class="header-buttons">
                <div class="btn"></div>
                <div class="btn"></div>
                <div class="btn"></div>
            </div>
            root@rebrand.ly:~/examhelp
        </div>

        <div class="terminal-body">
            
            <div class="status">[ ERR_CONNECTION_REFUSED: VAULT_OFFLINE ]</div>

            <h1>> rebrand.ly/examhelp.sh</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" data-target="100">0</div>
                    <div class="stat-label">Desperation Logs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" data-target="10">0</div>
                    <div class="stat-label">Grades Patched</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" data-target="4">0</div>
                    <div class="stat-label">Labs Bypassed</div>
                </div>
            </div>

            <div class="message-box">
                <span id="typing-text"></span><span class="cursor"></span>
            </div>

            <div class="countdown-wrapper">
                <div class="countdown-grid">
                    <div class="time-box">
                        <span id="hours">00</span>
                        <small>Hours</small>
                    </div>
                    <div class="time-box">
                        <span id="minutes">00</span>
                        <small>Minutes</small>
                    </div>
                    <div class="time-box">
                        <span id="seconds">00</span>
                        <small>Seconds</small>
                    </div>
                </div>
            </div>

            <div class="sys-log">
                [SYS] Terminating process... <br>
                [SYS] Target file locked: <span>rebrand.ly/examhelp</span> <br>
                [SYS] Have a good break.
            </div>

        </div>
    </div>

    <script>
        // Background Terminal Logs
        const bgContainer = document.getElementById('bg-container');
        const logPhrases = [
            "[INFO] Connecting to GNIT proxy...",
            "[WARN] Traffic spike detected on port 8080",
            "[ERR] java.lang.NullPointerException at finals.java",
            "chmod -R 777 /var/answers/",
            "sudo rm -rf /stress",
            "[OK] Payload 'copy_paste.sh' executed",
            "ping 127.0.0.1 -c 4",
            "[WARN] Admin logged in. Hiding directories...",
            "Decrypting module_3_notes.pdf...",
            "0x00000008: Memory segmentation fault",
            "SSH connection established: student@lab",
            "grep -r 'pass' ./exam_results/"
        ];

        function createBgLog() {
            let el = document.createElement('div');
            el.className = 'bg-log';
            el.innerText = `> ${logPhrases[Math.floor(Math.random() * logPhrases.length)]}`;
            
            el.style.top = `${Math.random() * 90}vh`;
            el.style.left = `${Math.random() * 80}vw`;
            
            bgContainer.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 2000);
            }, 1500);
        }

        setInterval(createBgLog, 300);

        // Stats Matrix Count Animation
        const statNumbers = document.querySelectorAll('.stat-number');

        statNumbers.forEach(stat => {
            const target = +stat.getAttribute('data-target');
            const duration = 2000;
            const increment = target / (duration / 16);
            let current = 0;

            const updateCounter = () => {
                current += increment;
                if (current < target) {
                    const isGlitch = Math.random() > 0.8;
                    stat.innerText = isGlitch ? Math.floor(Math.random() * 99) : Math.ceil(current);
                    requestAnimationFrame(updateCounter);
                } else {
                    stat.innerText = target + (target >= 10 ? '+' : '');
                }
            };

            setTimeout(updateCounter, 800);
        });

        // Typing animation
        const messageText = "Operation 'Pass The Lab' executed successfully. Target servers are strained. The underground script vault is officially encrypted and isolated from the mainframe. Rest your fingers. End of line.";
        
        const typingElement = document.getElementById('typing-text');
        let charIndex = 0;

        function typeMessage() {
            if (charIndex < messageText.length) {
                typingElement.innerHTML += messageText.charAt(charIndex);
                charIndex++;
                setTimeout(typeMessage, 30 + Math.random() * 40); 
            }
        }

        setTimeout(typeMessage, 1500);

        // ===============================
        // LIVE COUNTDOWN UPDATER
        // ===============================

        function getNextTargetDate() {
            const now = getRealTime();
            for (let i = 0; i < schedule.length; i++) {
                if (now < schedule[i].open) return schedule[i].open;
            }
            return finalReopenDate;
        }

        function updateCountdown() {
            if (!isTimeSynced) return; 

            if (checkStatus() === "OPEN") {
                window.location.replace(redirectUrl);
                return;
            }

            const now = getRealTime();
            const target = getNextTargetDate();
            const diff = target - now;

            const totalHours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("hours").textContent = String(totalHours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }
    </script>
</body>
</html>
